services:
  - type: web
    name: transcript-generation-system
    env: node
    plan: free
    buildCommand: npm ci --prefix client --include=dev && npm run build --prefix client && npm ci --prefix server --omit=dev
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/tgs/transcript_system.db
      - key: JWT_SECRET
        generateValue: true
